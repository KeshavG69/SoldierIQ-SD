[project]
name = "soldieriq-backend"
version = "0.1.0"
description = "SoldierIQ - Tactical Intelligence Knowledge Management System Backend"
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [
    { name = "SoldierIQ Team" }
]
dependencies = [
    # FastAPI and Server
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.29.0",
    "python-multipart>=0.0.9",
    # Pydantic
    "pydantic>=2.10.0",
    "pydantic-settings>=2.10.0",
    # Environment
    "python-dotenv>=1.1.0",
    # Database
    "pymongo>=4.9.0",
    "motor>=3.7.0",
    "redis>=6.2.0",
    # Task Queue
    "celery>=5.4.0",
    "nest-asyncio>=1.6.0",
    # AI & LLM
    "openai>=1.99.0",
    "anthropic>=0.60.0",
    "elevenlabs>=1.0.0", # Text-to-speech for podcast generation
    # Vector Database
    "pinecone[grpc]>=5.0.0", # gRPC avoids threading issues in Celery
    "langchain>=0.2.7",
    "langchain-community>=0.2.6",
    "langchain-openai>=0.1.7",
    "langchain-pinecone>=0.1.3",
    # Document Processing
    "pypdfium2>=4.30.0",
    "pypdf>=5.9.0",
    "aiofiles>=24.1.0",
    "markitdown[all]>=0.0.1a2",
    "unstructured-client>=0.29.0",
    "httpx>=0.27.0",
    "tiktoken>=0.8.0",
    # Web Scraping & YouTube
    "beautifulsoup4>=4.12.3",
    "html2text>=2025.4.0",
    "youtube-transcript-api>=1.2.1",
    # Cloud Storage
    "boto3>=1.40.0",
    "aioboto3>=13.0.0",
    # Utilities
    "pytz>=2025.2",
    "chonkie==1.5.6",
    "agno>=2.0.11",
    "groq>=1.0.0",
    "moviepy>=2.2.1",
    "scikit-image>=0.26.0",
    "numpy>=2.4.1",
    "faiss-cpu>=1.8.0",
    # Encoder extraction for the KG revamp (hybrid: GLiNER-Relex + GLiNER2).
    # Pull in torch/transformers transitively. Models (~2GB) download at runtime;
    # if unavailable the pipeline falls back to LLM-only extraction.
    # gliner is pinned to the exact git commit that carries the GLiNER-Relex
    # model class + inference() API (the PyPI release does not). Verified working
    # locally; re-verify if bumping.
    "gliner @ git+https://github.com/urchade/GLiNER.git@c3bb38dcab04ede890997f26a0dbe11fbea4dc7e",
    "gliner2>=1.3.2",
    "torch>=2.2.0",
    "yt-dlp>=2026.1.29",
    "pydub>=0.25.1",
    "scenedetect>=0.6.5",
    "av>=14.0.0",
    # Authentication
    "bcrypt>=4.1.2",
    "python-jose[cryptography]>=3.3.0",
    "email-validator>=2.3.0",
    "pymupdf>=1.27.1",
    "python-keycloak>=7.0.3",
    "pytak[with-crypto]>=7.2.1",
    "pyopenssl>=25.3.0",
    "cryptography>=46.0.5",
    "mlx-lm>=0.30.7",
    "asyncpg>=0.31.0",
    "langchain-postgres>=0.0.17",
    "psycopg>=3.3.3",
    "psycopg2-binary>=2.9.11",
    "langchain-experimental>=0.4.1",
    "json-repair>=0.58.3",
    # FalkorDB GraphRAG-SDK — native, lighter than Cognee
    # Use only the [litellm] extra; LiteLLM routes OpenRouter via the
    # ``openrouter/...`` model prefix (the [openrouter] extra pins an older
    # `openai` SDK that conflicts with LiteLLM).
    "graphrag-sdk[litellm,pdf]>=1.0.1",
    "falkordb>=1.0.9",
    "opencv-python-headless>=4.13.0.92",
    "composio>=0.16.0",
    "resend>=2.0.0",
]

